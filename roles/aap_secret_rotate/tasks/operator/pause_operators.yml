---
# Scales down AAP component operator controllers to prevent them from
# reverting secret changes during rotation.
#
# Operator selection uses known AAP deployment name prefixes defined in
# __aap_secret_rotate_operator_prefixes (vars/main.yml), matching only
# the operators for the requested components plus the resource-operator.
# This avoids scaling unrelated operators that happen to share the
# namespace.

# Build the list of operator prefixes for the requested components,
# always including the resource-operator.
- name: Build operator prefix list for requested components
  ansible.builtin.set_fact:
    __aap_secret_rotate_operator_match_prefixes: >-
      {{ (aap_secret_rotate_components
          | map('extract', __aap_secret_rotate_operator_prefixes)
          | select('string')
          | list)
         + (__aap_secret_rotate_operator_prefixes._always | default([])) }}

- name: List deployments in AAP namespace
  ansible.builtin.command:
    argv:
      - "{{ aap_secret_rotate_kubectl_binary }}"
      - -n
      - "{{ aap_secret_rotate_namespace }}"
      - get
      - deploy
      - -o
      - jsonpath={range .items[*]}{.metadata.name}={.spec.replicas}{"\n"}{end}
  register: __aap_secret_rotate_all_deploys
  changed_when: false

- name: Filter operator deployment lines
  ansible.builtin.set_fact:
    __aap_secret_rotate_operator_lines: >-
      {{ __aap_secret_rotate_all_deploys.stdout_lines | default([])
         | select('match', '.*=.*')
         | list }}

- name: Build operator deployment list
  ansible.builtin.set_fact:
    __aap_secret_rotate_operator_deploys: >-
      {{ dict(__aap_secret_rotate_operator_lines
         | select('match', '^(' ~ __aap_secret_rotate_operator_match_prefixes | join('|') ~ ').*=.*$')
         | map('regex_replace', '^(.+)=(.+)$', '\1,\2')
         | map('split', ',')
         | map('list')) }}

- name: Fail if no operator deployments were found
  ansible.builtin.fail:
    msg: >-
      No AAP operator deployments found in namespace
      '{{ aap_secret_rotate_namespace }}' matching prefixes:
      {{ __aap_secret_rotate_operator_match_prefixes | join(', ') }}.
      Check that the AAP operator is installed in this namespace.
      Override with aap_secret_rotate_deployment_type: podman if operators
      are not in the same namespace.
  when:
    - __aap_secret_rotate_operator_deploys | default({}) | length == 0
    - not aap_secret_rotate_dry_run

- name: Display operators to scale down
  ansible.builtin.debug:
    msg: >-
      Will scale down {{ __aap_secret_rotate_operator_deploys | length }}
      operator deployment(s): {{ __aap_secret_rotate_operator_deploys.keys() | list | join(', ') }}

- name: Scale down operator deployments
  ansible.builtin.command:
    argv:
      - "{{ aap_secret_rotate_kubectl_binary }}"
      - -n
      - "{{ aap_secret_rotate_namespace }}"
      - scale
      - "deploy/{{ item.key }}"
      - "--replicas=0"
  loop: "{{ __aap_secret_rotate_operator_deploys | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: item.value | int > 0
  when: not aap_secret_rotate_dry_run

- name: Wait for operator rollout to complete
  ansible.builtin.command:
    argv:
      - "{{ aap_secret_rotate_kubectl_binary }}"
      - -n
      - "{{ aap_secret_rotate_namespace }}"
      - rollout
      - status
      - "deploy/{{ item.key }}"
      - "--timeout={{ aap_secret_rotate_rollout_timeout }}s"
  loop: "{{ __aap_secret_rotate_operator_deploys | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  when: not aap_secret_rotate_dry_run

- name: Verify operator deployments are at 0 replicas
  ansible.builtin.command:
    argv:
      - "{{ aap_secret_rotate_kubectl_binary }}"
      - -n
      - "{{ aap_secret_rotate_namespace }}"
      - get
      - "deploy/{{ item.key }}"
      - -o
      - jsonpath={.spec.replicas}
  register: __aap_secret_rotate_op_verify
  loop: "{{ __aap_secret_rotate_operator_deploys | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  failed_when: __aap_secret_rotate_op_verify.stdout | default('1') | int != 0
  when: not aap_secret_rotate_dry_run

# Wait for all operator pods to actually terminate. spec.replicas=0 and
# rollout status do not guarantee pods have exited; a remaining pod can
# still reconcile secrets during rotation.
- name: Wait for operator pods to terminate
  ansible.builtin.command:
    argv:
      - "{{ aap_secret_rotate_kubectl_binary }}"
      - -n
      - "{{ aap_secret_rotate_namespace }}"
      - wait
      - --for=delete
      - pod
      - -l
      - "app.kubernetes.io/name={{ item.key }}"
      - "--timeout={{ aap_secret_rotate_rollout_timeout }}s"
  loop: "{{ __aap_secret_rotate_operator_deploys | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  failed_when: false
  when:
    - not aap_secret_rotate_dry_run
    - item.value | int > 0

# Final assertion: verify no pods remain for any operator we scaled down.
- name: Verify no operator pods remain
  ansible.builtin.command:
    argv:
      - "{{ aap_secret_rotate_kubectl_binary }}"
      - -n
      - "{{ aap_secret_rotate_namespace }}"
      - get
      - pods
      - -o
      - jsonpath={range .items[*]}{.metadata.name}{"\n"}{end}
  register: __aap_secret_rotate_op_pods_check
  changed_when: false
  when: not aap_secret_rotate_dry_run

- name: Assert all operator pods have terminated
  ansible.builtin.assert:
    that: >-
      (__aap_secret_rotate_op_pods_check.stdout_lines | default([])
       | select('search', item.key)
       | list | length) == 0
    fail_msg: >-
      Pods for operator deployment '{{ item.key }}' are still running
      after scaling to 0. Rotation cannot proceed safely.
    quiet: true
  loop: "{{ __aap_secret_rotate_operator_deploys | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not aap_secret_rotate_dry_run

- name: Dry run - would scale down operators
  ansible.builtin.debug:
    msg: >-
      [DRY RUN] Would scale down operator deployments:
      {{ __aap_secret_rotate_operator_deploys.keys() | list | join(', ') }}
  when:
    - aap_secret_rotate_dry_run
    - __aap_secret_rotate_operator_deploys | length > 0
...
