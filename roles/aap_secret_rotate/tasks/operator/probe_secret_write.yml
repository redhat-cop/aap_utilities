---
# Server-side apply dry-run probe for a component Secret.
# Required vars: _component, _component_config, _secret_value
#
# Must run before any database re-encryption so apply failures
# (unsupported kubernetes.core/python client, missing patch permissions,
# or admission policy) are caught while the DB and Secret still match.
# Uses the same module options as write_secret.yml with check_mode so
# the API performs a server-side dry-run and nothing is persisted.

- name: Probe server-side apply for {{ _component }}
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: aap-secret-rotate
      force_conflicts: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _component_config.k8s_secret }}"
        namespace: "{{ aap_secret_rotate_namespace }}"
      data: "{{ {_component_config.k8s_secret_field: _secret_value | b64encode} }}"
  check_mode: true
  no_log: true
...
