---
# Writes a new value to a Kubernetes secret using server-side apply.
# Required vars: _component, _component_config, _secret_value
#
# Uses kubernetes.core.k8s with server_side_apply and force_conflicts
# to ensure the write succeeds even when the field is owned by another
# manager such as External Secrets Operator. Uses base64-encoded data
# (not stringData) for correct server-side apply field tracking.

- name: Apply secret via server-side apply for {{ _component }}
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: aap-secret-rotate
      force_conflicts: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _component_config.k8s_secret }}"
        namespace: "{{ aap_secret_rotate_namespace }}"
      data: "{{ {_component_config.k8s_secret_field: _secret_value | b64encode} }}"
  no_log: true
  when: not aap_secret_rotate_dry_run

# Track that at least one secret was written so the always block
# in main.yml knows whether ESO can be safely restored.
- name: Mark secret as written for {{ _component }}  # noqa: name[template]
  ansible.builtin.set_fact:
    __aap_secret_rotate_any_secret_written: true
  when: not aap_secret_rotate_dry_run

- name: Dry run - would update K8s secret for {{ _component }}
  ansible.builtin.debug:
    msg: "[DRY RUN] Would update secret '{{ _component_config.k8s_secret }}' field '{{ _component_config.k8s_secret_field }}'"
  when: aap_secret_rotate_dry_run
...
