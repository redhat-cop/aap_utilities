---
# Writes a new value to a Kubernetes secret.
# Required vars: _component, _component_config, _secret_value
#
# Uses server-side apply with force-conflicts to ensure the write
# succeeds even when the field is owned by another manager such as
# External Secrets Operator. Without force-conflicts, regular patches
# are silently ignored by the API server when a different field manager
# owns the target field.

- name: Write and apply secret for {{ _component }}
  when: not aap_secret_rotate_dry_run
  block:
    - name: Create private temporary directory for {{ _component }}
      ansible.builtin.tempfile:
        state: directory
        prefix: aap_rotate_
      register: __aap_secret_rotate_tmpdir
      no_log: true

    - name: Write secret manifest for {{ _component }}
      ansible.builtin.copy:
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ _component_config.k8s_secret }}
            namespace: {{ aap_secret_rotate_namespace }}
          stringData:
            {{ _component_config.k8s_secret_field }}: {{ _secret_value | to_json }}
        dest: "{{ __aap_secret_rotate_tmpdir.path }}/secret.yml"
        mode: "0600"
      no_log: true

    - name: Update K8s secret for {{ _component }}
      ansible.builtin.command:
        argv:
          - "{{ aap_secret_rotate_kubectl_binary }}"
          - apply
          - --server-side
          - --force-conflicts
          - --field-manager=aap-secret-rotate
          - -f
          - "{{ __aap_secret_rotate_tmpdir.path }}/secret.yml"
      changed_when: true

  always:
    - name: Remove temporary directory for {{ _component }}
      ansible.builtin.file:
        path: "{{ __aap_secret_rotate_tmpdir.path }}"
        state: absent
      when: __aap_secret_rotate_tmpdir.path is defined
      no_log: true

- name: Dry run - would update K8s secret for {{ _component }}
  ansible.builtin.debug:
    msg: "[DRY RUN] Would update secret '{{ _component_config.k8s_secret }}' field '{{ _component_config.k8s_secret_field }}'"
  when: aap_secret_rotate_dry_run
...
