---
# Resumes External Secrets Operator reconciliation by scaling the ESO
# controller back to its original replica count.
# Only called when aap_secret_rotate_eso_resume_after is true.

- name: Scale up ESO controller deployments
  ansible.builtin.command:
    argv:
      - "{{ aap_secret_rotate_kubectl_binary }}"
      - -n
      - "{{ __aap_secret_rotate_eso_ns | trim }}"
      - scale
      - "deploy/{{ item.key }}"
      - "--replicas={{ item.value }}"
  loop: "{{ (__aap_secret_rotate_eso_original_replicas | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: true
  when:
    - not aap_secret_rotate_dry_run
    - __aap_secret_rotate_eso_original_replicas | default({}) | length > 0

- name: Wait for ESO controller pods to be ready
  ansible.builtin.command:
    argv:
      - "{{ aap_secret_rotate_kubectl_binary }}"
      - -n
      - "{{ __aap_secret_rotate_eso_ns | trim }}"
      - rollout
      - status
      - "deploy/{{ item.key }}"
      - --timeout=120s
  loop: "{{ (__aap_secret_rotate_eso_original_replicas | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  when:
    - not aap_secret_rotate_dry_run
    - __aap_secret_rotate_eso_original_replicas | default({}) | length > 0

- name: Display resumed ESO
  ansible.builtin.debug:
    msg: >-
      Restored ESO controller ({{ __aap_secret_rotate_eso_ns | trim }}) to original replicas:
      {{ __aap_secret_rotate_eso_original_replicas | default({}) }}.
      Note: ESO will reconcile secrets from the external store on next refresh.
      Ensure the external store has been updated with the new key values
      BEFORE ESO reconciles, otherwise the rotated keys will be overwritten.
  when: __aap_secret_rotate_eso_original_replicas | default({}) | length > 0
...
