[tox]
# Each CI matrix job installs only one Python; skip envs for missing interpreters.
skip_missing_interpreters = true

[ansible]
skip =
    py3.7
    py3.8
    py3.9
    py3.10
    py3.11-devel
    py3.12-devel
    py3.12-milestone
    2.9
    2.10
    2.11
    2.12
    2.13

[testenv]
pass_env =
    GITHUB_TOKEN
    ANSIBLE_GALAXY_SERVER*
    ANSIBLE_COLLECTIONS_PATH
