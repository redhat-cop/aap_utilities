---
bugfixes:
  - aap_secret_rotate - Use ``EDA_DB_ROTATION_KEY`` instead of ``EDA_SECRET_KEY``
    for EDA custom key rotation on operator deployments. The EDA
    ``rotate_db_encryption_key`` command in AAP 2.7.4+ reads the new key from
    ``EDA_DB_ROTATION_KEY`` to avoid a Dynaconf conflict where ``EDA_SECRET_KEY``
    would be loaded as the current ``settings.SECRET_KEY``, preventing decryption
    of existing data.
  - aap_secret_rotate - Fix ESO namespace detection when
    ``aap_secret_rotate_eso_namespace`` is empty. The ``default()`` Jinja2 filter
    does not replace empty strings unless called with ``true`` as the second
    argument, which caused the role to look in namespace ``""`` instead of
    ``external-secrets``.
  - aap_secret_rotate - Switch K8s secret writes from ``kubernetes.core.k8s``
    to ``kubectl apply --server-side --force-conflicts``. When External Secrets
    Operator manages a secret field, regular patches are silently ignored by the
    API server field ownership model, leaving the rotated key unpersisted.
  - aap_secret_rotate - Scale down AAP component operators during rotation to
    prevent them from reverting K8s secrets to their original values. Operators
    reconcile their managed secrets and would overwrite rotated keys before new
    pods pick them up.
...
